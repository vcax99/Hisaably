# Actions tab → "Android dev APK" → Run workflow, then download
# Hisaably-dev.apk from the run's Artifacts. Talks to the hisaably-dev backend
# (settings from the APP_ENV_JSON_DEV secret).
name: Android dev APK

on:
  workflow_dispatch:

jobs:
  apk:
    uses: ./.github/workflows/_android-apk.yml
    with:
      flavor: dev
    secrets:
      env_json: ${{ secrets.APP_ENV_JSON_DEV }}
      keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
