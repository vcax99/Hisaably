# Shared build for "Android dev APK" and "Android prod APK" (the two
# workflows that call this one). Builds a signed APK for one backend and
# uploads it as Hisaably-<flavor>.apk. The signing key and app settings come
# from the repository's encrypted secrets; nothing secret is in this repo.
name: Android APK (shared)

on:
  workflow_call:
    inputs:
      flavor:
        description: dev or prod
        required: true
        type: string
    secrets:
      env_json:
        required: true
      keystore_base64:
        required: true
      keystore_password:
        required: true
      key_alias:
        required: true
      key_password:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: App settings (env JSON)
        env:
          APP_ENV_JSON: ${{ secrets.env_json }}
        run: |
          mkdir -p env
          printf '%s' "$APP_ENV_JSON" > env/app.json

      # A dev APK must talk to dev and a prod APK to prod: refuse a mix-up.
      - name: Check the settings match "${{ inputs.flavor }}"
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          env = json.load(open("env/app.json"))
          flavor = os.environ["FLAVOR"]
          if env.get("APP_ENV") != flavor:
              sys.exit(f"APP_ENV is {env.get('APP_ENV')!r}, expected {flavor!r}: wrong secret?")
          if not env.get("SUPABASE_URL", "").startswith("https://"):
              sys.exit("SUPABASE_URL is missing")
          print(f"{flavor} backend: {env['SUPABASE_URL']}")
          PY

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.keystore_base64 }}
          KEYSTORE_PASSWORD: ${{ secrets.keystore_password }}
          KEY_ALIAS: ${{ secrets.key_alias }}
          KEY_PASSWORD: ${{ secrets.key_password }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build signed APK
        run: flutter build apk --release --dart-define-from-file=env/app.json

      - name: Check the signature (must be the Hisaably upload key)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee signature.txt
          grep -q "CN=Bikash, O=Hisaably" signature.txt

      - name: Rename
        run: mv build/app/outputs/flutter-apk/app-release.apk "Hisaably-${{ inputs.flavor }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Hisaably-${{ inputs.flavor }}
          path: Hisaably-${{ inputs.flavor }}.apk
          retention-days: 30

      - name: Remove key material from the runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties env/app.json
