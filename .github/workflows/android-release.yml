# Builds a signed Android APK in the cloud. Run it from the repo's
# Actions tab → "Android release APK" → Run workflow, then download the APK
# from the run's Artifacts. The signing key and app settings come from the
# repository's encrypted secrets; nothing secret is stored in this repo.
name: Android release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: App settings (env JSON)
        env:
          APP_ENV_JSON: ${{ secrets.APP_ENV_JSON }}
        run: |
          mkdir -p env
          printf '%s' "$APP_ENV_JSON" > env/app.json

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build signed APK
        run: flutter build apk --release --dart-define-from-file=env/app.json

      - name: Check the signature (must be the Hisaably upload key)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee signature.txt
          grep -q "CN=Bikash, O=Hisaably" signature.txt

      - name: Rename
        run: mv build/app/outputs/flutter-apk/app-release.apk "Hisaably-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Hisaably-APK-${{ github.run_number }}
          path: Hisaably-${{ github.run_number }}.apk
          retention-days: 30

      - name: Remove key material from the runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties env/app.json
